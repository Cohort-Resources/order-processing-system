spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:postgres_db}:${DATABASE_PORT:5432}/${DATABASE_NAME:order_service}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
server:
  port: 8080
logging:
  level:
    root: warn
    xyz:
      catuns:
        dscms:
          orderservice: info
